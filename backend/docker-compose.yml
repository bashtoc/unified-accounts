name: safer-signal

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-safer_unified}
      MYSQL_USER: ${MYSQL_USER:-safer}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - safer-signal-mysql-data:/var/lib/mysql
    networks:
      - safer-signal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://${MYSQL_USER:-safer}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-safer_unified}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://signal.saference.com}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4002}:4000"
    networks:
      - safer-signal
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  safer-signal:
    name: safer-signal-network

volumes:
  safer-signal-mysql-data:
    name: safer-signal-mysql-data
